<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Red Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a090b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#120407" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050103" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3038"/>
      <stop offset="50%" stop-color="#1a1c22"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </linearGradient>

    <linearGradient id="antennaChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#88929f"/>
      <stop offset="50%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#48505c"/>
    </linearGradient>
  </defs>

  <!-- Background circular badge -->
  <circle cx="250" cy="250" r="235" fill="url(#bgGlow)" stroke="#e71923" stroke-width="4" filter="url(#neonGlow)" />
  
  <!-- Retro Grid Horizon Lines -->
  <path d="M 50 350 L 450 350 M 70 380 L 430 380 M 100 410 L 400 410 M 140 440 L 360 440" stroke="#ff2a3b" stroke-width="1.5" stroke-opacity="0.4" />
  <path d="M 250 350 L 150 460 M 250 350 L 210 460 M 250 350 L 290 460 M 250 350 L 350 460" stroke="#ff2a3b" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- 1980s Walkie-Talkie Body -->
  <g transform="translate(185, 95)">
    <!-- Antenna -->
    <rect x="25" y="-60" width="6" height="75" fill="url(#antennaChrome)" rx="2"/>
    <circle cx="28" cy="-62" r="5" fill="#e71923" filter="url(#neonGlow)"/>
    
    <!-- Antenna radio RF Waves -->
    <path d="M 12 -72 A 20 20 0 0 1 44 -72" fill="none" stroke="#ff2a3b" stroke-width="2" filter="url(#neonGlow)" opacity="0.8"/>
    <path d="M 4 -82 A 30 30 0 0 1 52 -82" fill="none" stroke="#ff2a3b" stroke-width="2" filter="url(#neonGlow)" opacity="0.5"/>

    <!-- Radio Volume Knobs -->
    <rect x="85" y="-12" width="18" height="16" fill="#1b1c20" stroke="#444" stroke-width="1" rx="3"/>
    <line x1="88" y1="-8" x2="88" y2="-2" stroke="#888" stroke-width="1"/>
    <line x1="94" y1="-8" x2="94" y2="-2" stroke="#888" stroke-width="1"/>
    <line x1="100" y1="-8" x2="100" y2="-2" stroke="#888" stroke-width="1"/>

    <!-- Main Chassis -->
    <rect x="10" y="0" width="110" height="210" rx="14" fill="url(#metalBody)" stroke="#444a56" stroke-width="3"/>
    
    <!-- Side Ribs (Grip) -->
    <line x1="6" y1="50" x2="10" y2="50" stroke="#666" stroke-width="3"/>
    <line x1="6" y1="65" x2="10" y2="65" stroke="#666" stroke-width="3"/>
    <line x1="6" y1="80" x2="10" y2="80" stroke="#666" stroke-width="3"/>
    <line x1="6" y1="95" x2="10" y2="95" stroke="#666" stroke-width="3"/>

    <!-- PTT Side Button (Glowing Red) -->
    <rect x="2" y="55" width="8" height="42" rx="4" fill="#e71923" filter="url(#neonGlow)"/>

    <!-- Vintage Speaker Metal Grill Plate -->
    <rect x="25" y="24" width="80" height="80" rx="8" fill="#121418" stroke="#333" stroke-width="2"/>
    <!-- Speaker Slots -->
    <line x1="35" y1="42" x2="95" y2="42" stroke="#222" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="52" x2="95" y2="52" stroke="#222" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="62" x2="95" y2="62" stroke="#222" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="72" x2="95" y2="72" stroke="#222" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="82" x2="95" y2="82" stroke="#222" stroke-width="3" stroke-linecap="round"/>

    <!-- LED Indicator -->
    <circle cx="95" cy="16" r="3.5" fill="#ff2a3b" filter="url(#neonGlow)"/>

    <!-- 1983 Hawkins AV Badge Plate -->
    <rect x="25" y="120" width="80" height="38" rx="4" fill="#0d0e12" stroke="#e71923" stroke-width="1"/>
    <text x="65" y="136" font-family="'Courier New', monospace" font-size="9" font-weight="900" fill="#ffaa00" text-anchor="middle" letter-spacing="1">CH 011</text>
    <text x="65" y="148" font-family="'Courier New', monospace" font-size="6.5" font-weight="700" fill="#e71923" text-anchor="middle" letter-spacing="0.5">HAWKINS AV</text>
  </g>

  <!-- Stranger Things Top & Bottom Framing Lines -->
  <line x1="55" y1="365" x2="445" y2="365" stroke="#e71923" stroke-width="3" filter="url(#neonGlow)"/>
  <line x1="90" y1="440" x2="410" y2="440" stroke="#e71923" stroke-width="3" filter="url(#neonGlow)"/>

  <!-- Stranger Things Typography -->
  <text x="250" y="405" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="36" font-weight="900" fill="none" stroke="#e71923" stroke-width="2.5" text-anchor="middle" letter-spacing="5" filter="url(#neonGlow)">
    STRANGER COMMS
  </text>
  <text x="250" y="405" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="36" font-weight="900" fill="#ff2a3b" text-anchor="middle" letter-spacing="5">
    STRANGER COMMS
  </text>

  <text x="250" y="428" font-family="'Courier New', monospace" font-size="11" font-weight="800" fill="#ffaa00" text-anchor="middle" letter-spacing="3">
    HAWKINS INDIANA // 1983
  </text>
</svg>
